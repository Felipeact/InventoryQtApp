name: inventory_mobile
description: "Field-technician companion app for the Inventory & Truck-Stock SaaS platform."
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.6.0 <4.0.0"
  flutter: ">=3.33.0"

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # State management
  provider: ^6.1.2

  # Networking
  dio: ^5.7.0

  # Secure / local persistence
  flutter_secure_storage: ^9.2.2
  shared_preferences: ^2.3.2

  # Barcode scanning
  mobile_scanner: ^5.2.3

  # Image capture / picking for receipts
  image_picker: ^1.1.2

  # Formatting
  intl: ^0.19.0

  # Charts
  fl_chart: ^0.69.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  # Generates platform launcher icons from assets/icon/* (run after pub get):
  #   dart run flutter_launcher_icons
  flutter_launcher_icons: ^0.14.1

flutter:
  uses-material-design: true

# App launcher icon generation. Source art lives in assets/icon/ and is produced
# by tool/generate_icons.py. Regenerate platform icons with:
#   dart run flutter_launcher_icons
flutter_launcher_icons:
  image_path: "assets/icon/app_icon.png"
  android: true
  ios: true
  remove_alpha_ios: true
  min_sdk_android: 21
  # Android 8+ adaptive icon (foreground art on the brand gradient background).
  adaptive_icon_background: "assets/icon/app_icon_background.png"
  adaptive_icon_foreground: "assets/icon/app_icon_foreground.png"
  web:
    generate: false
  windows:
    generate: false
  macos:
    generate: false

