name: inventory_mobile
description: "Field-technician companion app for the Inventory & Truck-Stock SaaS platform."
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # State management
  provider: ^6.1.2

  # Networking
  dio: ^5.7.0

  # Secure / local persistence
  flutter_secure_storage: ^9.2.2
  shared_preferences: ^2.3.2

  # Barcode scanning
  mobile_scanner: ^5.2.3

  # Image capture / picking for receipts
  image_picker: ^1.1.2

  # Formatting
  intl: ^0.19.0

  # Charts
  fl_chart: ^0.69.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
